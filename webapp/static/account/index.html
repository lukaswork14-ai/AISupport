<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tài khoản superYou</title>
<meta name="description" content="Một cửa đăng nhập superYou: người dùng, người bán và chủ sàn. Chuyển vai trong một chạm.">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="/brand/icon-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --ink:#0E0B14; --paper:#FFFFFF; --soft:#FBF3DF; --muted:#6B5F45; --line:#E9DFC6; --violet:#14111A; --on-violet:#FFFFFF; --violet-d:#000000; --yellow:#FFD23F; --green:#0F7A45; --red:#B42346; --amber:#C98205;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif }
@media (prefers-color-scheme:dark){ :root{ --ink:#FFF8E7; --paper:#14111A; --soft:#1F1B15; --muted:#B0A68F; --line:#332D24; --violet:#FFD23F; --on-violet:#14111A; --violet-d:#FFE27A; --green:#5BCB82; --red:#F27896; --amber:#F0A35C } }
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 var(--font); -webkit-font-smoothing:antialiased }
a{ color:var(--violet) }
button,input,select,textarea{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--violet); outline-offset:2px }
.w{ max-width:1100px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
header{ padding-block:12px; border-bottom:1px solid var(--line) }
nav{ display:flex; align-items:center; gap:14px }
.logo{ display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); font-weight:900; font-size:19px; letter-spacing:-.03em }
.logo img{ width:32px; height:32px; border-radius:10px; object-fit:cover }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:13px; border:2px solid var(--ink); background:var(--paper); font-weight:800; cursor:pointer; text-decoration:none; color:var(--ink); white-space:nowrap }
.btn.v{ background:var(--violet); color:var(--on-violet); border-color:var(--violet) } .btn.y{ background:var(--yellow); color:#0E0B14; border-color:#0E0B14 } .btn.sm{ padding:7px 12px; font-size:14px; border-radius:10px } .btn.ghost{ border-color:var(--line) }
.btn:disabled{ opacity:.5; cursor:default }
.auth{ max-width:460px; margin:40px auto; display:flex; flex-direction:column; gap:16px }
.auth h1{ margin:0; font-size:34px; letter-spacing:-.04em; line-height:1.1; font-weight:900; text-wrap:balance }
.card{ background:var(--paper); border:1.5px solid var(--line); border-radius:22px; padding:22px; display:flex; flex-direction:column; gap:12px; min-width:0 }
label.f{ display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:14px }
label.f input,label.f select{ padding:12px 13px; border-radius:12px; border:1.5px solid var(--line); background:var(--soft); font-weight:400; font-size:16px; width:100%; color:var(--ink) }
.msg{ font-weight:700; min-height:1.4em; margin:0 } .msg.err{ color:var(--red) } .msg.ok{ color:var(--green) }
.tabs{ display:flex; gap:6px; background:var(--soft); padding:4px; border-radius:12px } .tabs button{ flex:1; padding:9px; border-radius:9px; border:0; background:transparent; font-weight:700; cursor:pointer } .tabs button.on{ background:var(--paper); box-shadow:0 1px 3px rgba(0,0,0,.12) }
.owner{ border:2px dashed var(--line); border-radius:18px; padding:16px; display:flex; gap:12px; align-items:center }
.owner img{ width:44px; height:44px; border-radius:50%; object-fit:cover }
.by{ color:var(--muted); font-size:14px }
/* trung tâm tài khoản */
.shell{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px; padding-block:28px 60px }
@media (max-width:820px){ .shell{ grid-template-columns:minmax(0,1fr) } .side{ position:static } }
.side{ display:flex; flex-direction:column; gap:6px; position:sticky; top:16px; align-self:start }
.side button{ text-align:left; padding:11px 14px; border-radius:12px; border:0; background:transparent; font-weight:600; cursor:pointer; display:flex; gap:10px; align-items:center; color:var(--ink) }
.side button.on{ background:var(--soft) }
.rolesw{ position:relative } .rolemenu{ position:absolute; right:0; top:46px; background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:8px; min-width:260px; z-index:5; box-shadow:0 12px 30px rgba(0,0,0,.14); display:none } .rolemenu.open{ display:block }
.roleitem{ display:flex; gap:10px; align-items:center; width:100%; padding:10px; border-radius:11px; border:0; background:transparent; text-align:left; cursor:pointer; color:var(--ink) } .roleitem:hover{ background:var(--soft) } .roleitem.on{ background:var(--soft); font-weight:700 }
.ric{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff; font-weight:900; flex:none }
.avatar{ width:36px; height:36px; border-radius:50%; background:var(--violet); color:var(--on-violet); display:grid; place-items:center; font-weight:800 }
h2{ margin:0 0 4px; font-size:26px; letter-spacing:-.03em; font-weight:900 }
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px } .tile{ border:1.5px solid var(--line); border-radius:16px; padding:14px } .tile b{ display:block; font-size:24px; font-weight:900; letter-spacing:-.02em } .tile span{ color:var(--muted); font-size:13px }
.list{ border:1.5px solid var(--line); border-radius:18px; overflow:hidden } .rowi{ display:flex; gap:12px; align-items:center; padding:13px 16px; border-top:1px solid var(--line) } .rowi:first-child{ border-top:0 }
.plan{ border:2px solid var(--line); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:8px; position:relative } .plan.cur{ border-color:var(--c) } .plan .pname{ font-weight:900; font-size:18px } .plan .price{ font-size:26px; font-weight:900; letter-spacing:-.03em } .plan ul{ margin:0; padding-left:18px; font-size:14px; display:flex; flex-direction:column; gap:3px } .plan .tag{ position:absolute; top:-10px; left:16px; background:var(--c); color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px }
.plans{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px }
.pill{ font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--soft) }
.hint{ background:var(--soft); border-radius:14px; padding:12px 14px; font-size:14px }
.agree{ display:flex; gap:10px; align-items:flex-start; margin-top:12px; font-size:14px; line-height:1.45 }
.agree input{ width:20px; height:20px; margin-top:1px; flex:none; accent-color:var(--violet, #14111A) }
.row2{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px }
.vatg{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px } @media (max-width:600px){ .vatg{ grid-template-columns:1fr } } .vatf summary{ cursor:pointer }
.cpbox:empty, .rowi > .msg:empty{ display:none }
</style>
</head>
<body>
<header><div class="w"><nav><a class="logo" href="/landing"><img src="/brand/mark.svg" alt="">superYou</a><span class="by" id="crumb">Tài khoản</span><span style="flex:1"></span><div id="topr"></div></nav></div></header>
<main id="main" class="w"></main>
<script>
(function(){
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function vnd(v){ return v > 0 ? Number(v).toLocaleString('vi-VN') + 'đ' : 'Miễn phí'; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
var A = { tok: lsGet('sy-acc'), me: null, view: 'home', err: '' };
(function(){ var h = (location.hash||'').slice(1); h = h==='plans' ? 'plan' : h; if(['home','try','buys','plan','profile','security'].indexOf(h) >= 0) A.view = h; })();
function api(path, body){
  var h = {'Content-Type':'application/json'}; if(A.tok) h['X-Account'] = A.tok;
  return fetch(path, body === undefined ? {headers:h} : {method:'POST', headers:h, body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {error:'Phản hồi không hợp lệ'}; }).then(function(j){ if(!r.ok || j.error){ var e = new Error(j.error || 'Có lỗi'); e.status = r.status; throw e; } return j; }); });
}
var ROLE = { owner:{label:'Chủ sàn', sub:'superYou HQ: điều hành toàn bộ', ic:'H', c:'#B42346', go:'/hq'}, seller:{label:'Người bán', sub:'Console Marketplace', ic:'B', c:'#0E7C6B', go:'/market/console'}, member:{label:'Người dùng', sub:'Tài khoản, sản phẩm, gói', ic:'U', c:'#14111A', go:'/account'} };

/* ---------- đăng nhập / đăng ký ---------- */
function authView(mode){
  mode = mode || 'login';
  $('#topr').innerHTML = '';
  $('#main').innerHTML = '<div class="auth"><h1>'+(mode==='login' ? 'Đăng nhập superYou' : 'Tạo tài khoản superYou')+'</h1><p class="by" style="margin:0">Một tài khoản cho mọi vai: người dùng, người bán, chủ sàn. Chuyển vai trong một chạm.</p>'
    + '<div class="tabs"><button class="'+(mode==='login'?'on':'')+'" id="tLogin">Đăng nhập</button><button class="'+(mode==='signup'?'on':'')+'" id="tSignup">Đăng ký</button></div>'
    + (mode==='login'
      ? '<form class="card" id="lf"><label class="f">Email<input id="le" type="email" required autocomplete="email" value="'+esc(lsGet('sy-email')||'')+'"></label><label class="f">Mật khẩu<input id="lp" type="password" required autocomplete="current-password" minlength="8"></label><button class="btn v">Đăng nhập</button><p class="msg" id="lm" role="status"></p></form>'
      : '<form class="card" id="sf"><label class="f">Tên hiển thị<input id="sn" required maxlength="60" autocomplete="name"></label><label class="f">Email<input id="se" type="email" required autocomplete="email"></label><label class="f">Mật khẩu (từ 8 ký tự)<input id="sp" type="password" required minlength="8" autocomplete="new-password"></label>'
        + '<label class="agree"><input type="checkbox" id="sag"> <span>Tôi đã đọc và đồng ý <a href="/dieu-khoan" target="_blank" rel="noopener">Điều khoản</a> và <a href="/bao-mat" target="_blank" rel="noopener">Quyền riêng tư</a> (bản nháp, đang được rà soát).</span></label>'
        + '<button class="btn v">Tạo tài khoản</button><p class="msg" id="sm" role="status"></p></form>')
    + '<div class="owner"><img src="/icons/huy-128.png" alt=""><div style="flex:1"><b>Chủ sàn / superHuy</b><div class="by">Mở khoá bằng mã PIN hoặc Face ID, không dùng mật khẩu.</div></div><a class="btn sm y" href="/app">Mở app</a></div></div>';
  $('#tLogin').onclick = function(){ authView('login'); }; $('#tSignup').onclick = function(){ authView('signup'); };
  var lf = $('#lf'); if(lf) lf.addEventListener('submit', function(e){ e.preventDefault(); var m = $('#lm'), b = lf.querySelector('button'); b.disabled = true; m.className='msg'; m.textContent='Đang đăng nhập…';
    api('/api/account/login', {email:$('#le').value, password:$('#lp').value}).then(function(r){ A.tok = r.session; lsSet('sy-acc', r.session); lsSet('sy-email', $('#le').value); afterLogin(r.user); })
      .catch(function(err){ m.className='msg err'; m.textContent = err.message; b.disabled = false; }); });
  var sf = $('#sf'); if(sf) sf.addEventListener('submit', function(e){ e.preventDefault(); var m = $('#sm'), b = sf.querySelector('button'); b.disabled = true; m.className='msg'; m.textContent='Đang tạo…';
    if(!$('#sag').checked){ m.className='msg err'; m.textContent='Bạn tích ô đồng ý Điều khoản và Quyền riêng tư để tiếp tục.'; b.disabled = false; return; }
    var role = new URLSearchParams(location.search).get('role') === 'seller' ? 'seller' : 'member';
    api('/api/account/signup', {name:$('#sn').value, email:$('#se').value, password:$('#sp').value, role:role, plan:'free', agree:true}).then(function(r){ A.tok = r.session; lsSet('sy-acc', r.session); lsSet('sy-email', $('#se').value); if(role === 'member') A.view = 'try'; afterLogin(r.user); })
      .catch(function(err){ m.className='msg err'; m.textContent = err.message; b.disabled = false; }); });
}
function afterLogin(u){
  var next = new URLSearchParams(location.search).get('next');
  if(next && /^\/[a-z]/.test(next)) return location.href = next;
  var r = u.last_role || u.roles[0];
  if(r === 'seller') return location.href = '/market/console';
  if(r === 'owner') return location.href = '/hq';
  history.replaceState(null, '', '/account'); load();
}

/* ---------- trung tâm tài khoản ---------- */
function load(){
  $('#main').innerHTML = '<p class="by" style="padding:30px 0">Đang mở tài khoản…</p>';
  api('/api/account/me', {}).then(function(r){ A.me = r; render(); }).catch(function(e){ if(e.status === 401){ A.tok = null; lsSet('sy-acc', null); authView('login'); } else $('#main').innerHTML = '<p class="msg err" style="padding:30px 0">'+esc(e.message)+'</p>'; });
}
function roleSwitcher(){
  var u = A.me.user, cur = u.role || u.roles[0];
  return '<div class="rolesw"><button class="btn sm ghost" id="rsb"><span class="ric" style="background:'+ROLE[cur].c+';width:24px;height:24px;border-radius:7px;font-size:12px">'+ROLE[cur].ic+'</span>'+esc(ROLE[cur].label)+' ▾</button>'
    + '<div class="rolemenu" id="rsm"><div class="by" style="padding:6px 10px">Chuyển vai, giống chuyển giữa trang cá nhân và Page</div>'
    + u.roles.map(function(r){ return '<button class="roleitem '+(r===cur?'on':'')+'" data-r="'+r+'"><span class="ric" style="background:'+ROLE[r].c+'">'+ROLE[r].ic+'</span><span><b>'+esc(ROLE[r].label)+'</b><br><span class="by">'+esc(ROLE[r].sub)+'</span></span></button>'; }).join('')
    + (u.roles.indexOf('seller')<0 ? '<button class="roleitem" id="addSeller"><span class="ric" style="background:#0E7C6B">+</span><span><b>Mở vai Người bán</b><br><span class="by">Bán skill, workflow, gói tri thức</span></span></button>' : '')
    + '<div style="border-top:1px solid var(--line);margin:6px 0"></div><button class="roleitem" id="lo"><span class="ric" style="background:var(--muted)">⎋</span><span>Đăng xuất</span></button></div></div>';
}
function bindRoles(){
  var b = $('#rsb'), m = $('#rsm'); if(!b) return;
  b.onclick = function(e){ e.stopPropagation(); m.classList.toggle('open'); };
  document.addEventListener('click', function(){ m.classList.remove('open'); });
  m.querySelectorAll('[data-r]').forEach(function(x){ x.onclick = function(){ var r = x.dataset.r; api('/api/account/role', {role:r}).then(function(){ if(ROLE[r].go !== '/account') location.href = ROLE[r].go; else load(); }).catch(function(e){ alert2(e.message); }); }; });
  var as = $('#addSeller'); if(as) as.onclick = function(){ api('/api/account/add_role', {role:'seller'}).then(function(r){ load(); setTimeout(function(){ alert2(r.text); }, 300); }).catch(function(e){ alert2(e.message); }); };
  $('#lo').onclick = function(){ api('/api/account/logout', {}).catch(function(){}).then(function(){ A.tok = null; lsSet('sy-acc', null); authView('login'); }); };
}
function alert2(t){ var el = document.createElement('div'); el.className = 'hint'; el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.2)'; el.textContent = t; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 3500); }
function dmy(iso){ var a = String(iso||'').slice(0,10).split('-'); return a.length===3 ? a[2]+'/'+a[1]+'/'+a[0] : esc(iso||''); }
function daysLeft(iso){ var t = new Date(String(iso).slice(0,10)+'T23:59:59'); return Math.floor((t - new Date())/86400000); }
function planDue(u){
  if(u.plan==='trial' && u.trial_until) return ' · dùng thử đến '+dmy(u.trial_until);
  if((u.plan==='pro' || u.plan==='business') && u.plan_until) return ' · hết hạn '+dmy(u.plan_until);
  return '';
}
function planBanner(u, me){
  if(u.plan_expired && u.plan==='free'){ var pe = me.plans.plans[u.plan_expired.plan]; return '<div class="hint" style="margin:0 0 14px">Gói '+esc(pe ? pe.name : u.plan_expired.plan)+' của bạn đã hết hạn'+(u.plan_expired.until ? ' ngày '+dmy(u.plan_expired.until) : '')+' nên tài khoản về gói Miễn phí. Dữ liệu, sản phẩm đã mua và workflow vẫn giữ nguyên. '+(me.payments_open ? '<a href="#" data-v="plan">Gia hạn</a>' : '')+'</div>'; }
  if((u.plan==='pro' || u.plan==='business') && u.plan_until){
    var n = daysLeft(u.plan_until);
    if(n <= 3) return '<div class="hint" style="margin:0 0 14px"><b>Gói sắp hết hạn</b> · '+(n<=0 ? 'hết hôm nay' : 'còn '+n+' ngày')+' (đến hết '+dmy(u.plan_until)+'). Hết hạn tự về Miễn phí, không mất dữ liệu. '+(me.payments_open ? '<a href="#" data-v="plan">Gia hạn</a>' : '')+'</div>';
  }
  return '';
}
var BUY_REASONS = {khong_tai:'Không tải / cài được', sai_mo_ta:'Không đúng mô tả', hoan_tien:'Muốn hoàn tiền (7 ngày)', khac:'Vấn đề khác'};
function buyRow(it){
  var st = it.status==='refunded' ? '<span class="by" style="color:#B42346">Đã hoàn tiền</span>' : '';
  var meta = esc(it.code)+' · '+dmy(it.paid_at)+' · '+(it.amount ? esc(it.amount_text) : 'Miễn phí') + (it.kind==='plan' && it.plan_until ? ' · dùng đến hết '+dmy(it.plan_until) : '') + (it.vat ? ' · HĐ VAT '+esc(it.vat.company)+(it.vat.status==='da_xuat' ? ' đã xuất'+(it.vat.number ? ' số '+esc(it.vat.number) : '') : ' đang chờ xuất') : '');
  var act = '';
  if(it.can_download){
    var live = (it.downloads||[]).filter(function(d){ return !d.expired; });
    act += live.length ? live.map(function(d){ return '<a class="btn sm" href="'+esc(d.url)+'">Tải</a>'; }).join('') : '<button class="btn sm" data-redl="'+esc(it.id)+'">Tải lại</button>';
  }
  if(it.status==='delivered' && A.me.buys_mail) act += '<button class="btn sm ghost" data-rs="'+esc(it.id)+'">Gửi lại email</button>';
  if(it.receipt) act += '<a class="btn sm ghost" href="'+esc(it.receipt)+'" target="_blank" rel="noopener">Hoá đơn</a>';
  if(it.can_complain) act += '<button class="btn sm ghost" data-cp="'+esc(it.id)+'">Khiếu nại</button>';
  var foot = '';
  if(it.complaint) foot = '<span class="by">Đã khiếu nại '+dmy(it.complaint.at)+' · '+({moi:'chủ sàn đang xử lý, phản hồi trong 2 ngày làm việc', da_hoan:'đã chấp nhận, superYou hoàn tiền cho bạn', tu_choi:'chưa được chấp nhận'}[it.complaint.status] || esc(it.complaint.status))+(it.complaint.reply ? '<br>Phản hồi: '+esc(it.complaint.reply) : '')+'</span>';
  else if(it.refundable) foot = '<span class="by">Có thể yêu cầu hoàn tiền đến '+dmy(it.refund_until)+'</span>';
  return '<div class="rowi" style="flex-wrap:wrap;align-items:flex-start" id="o-'+esc(it.id)+'"><span style="flex:1;min-width:180px"><b>'+esc(it.name)+'</b> '+st+'<br><span class="by">'+meta+'</span>'+(foot ? '<br>'+foot : '')+'</span>'
    + '<span style="display:flex;gap:6px;flex-wrap:wrap">'+act+'</span><div class="cpbox" style="flex-basis:100%"></div><p class="msg" style="flex-basis:100%;margin:0" role="status"></p></div>';
}
function buyMsg(oid, t, err){ var m = document.querySelector('#o-'+oid+' .msg'); if(m){ m.className = 'msg'+(err?' err':''); m.textContent = t; } }
function buyReload(oid, t){ api('/api/account/orders', {}).then(function(r){ A.me.entitlements = r.items; A.me.buys_mail = r.mail_ready; render(); if(t) buyMsg(oid, t); }).catch(function(){}); }
function buyBind(){
  document.querySelectorAll('[data-redl]').forEach(function(b){ b.onclick = function(){ var id = b.dataset.redl; b.disabled = true; api('/api/account/redownload', {oid:id}).then(function(r){ buyReload(id, r.text); }).catch(function(e){ buyMsg(id, e.message, true); b.disabled = false; }); }; });
  document.querySelectorAll('[data-rs]').forEach(function(b){ b.onclick = function(){ var id = b.dataset.rs; b.disabled = true; api('/api/account/resend', {oid:id}).then(function(r){ buyMsg(id, r.text); }).catch(function(e){ buyMsg(id, e.message, true); b.disabled = false; }); }; });
  document.querySelectorAll('[data-cp]').forEach(function(b){ b.onclick = function(){ var id = b.dataset.cp, box = document.querySelector('#o-'+id+' .cpbox');
