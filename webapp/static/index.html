<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>superHuy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-secondary-bg-color, #F1F2F4);
  --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #FFFFFF));
  --text: var(--tg-theme-text-color, #15171A);
  --muted: var(--tg-theme-hint-color, #7C828A);
  --line: color-mix(in srgb, var(--text) 9%, transparent);
  --fill: color-mix(in srgb, var(--text) 6%, transparent);
  --jade: #0B9877;
  --jade-ink: #FFFFFF;
  --jade-soft: color-mix(in srgb, var(--jade) 13%, transparent);
  --amber: #C98205;
  --amber-soft: color-mix(in srgb, #E8A317 16%, transparent);
  --danger: var(--tg-theme-destructive-text-color, #D64545);
  --r-sheet: 26px; --r-card: 20px; --r-ctl: 14px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom);
}
html[data-scheme="dark"]{ --jade:#33D1A8; --jade-ink:#062018; --amber:#F2B23A; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 "Be Vietnam Pro", -apple-system, system-ui, sans-serif; -webkit-font-smoothing:antialiased }
body{ padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px) }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--jade); outline-offset:2px }
svg{ display:block }
.wrap{ max-width:640px; margin:0 auto; padding:14px 16px 8px }

/* ---------- đầu trang */
.date{ color:var(--muted); font-size:13px; font-weight:500 }
h1{ font-size:27px; line-height:1.15; font-weight:700; letter-spacing:-.02em; margin:2px 0 14px }
h2{ font-size:17px; font-weight:600; letter-spacing:-.01em; margin:0 }
.sec{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 10px }
.sec .link{ color:var(--jade); font-size:14px; font-weight:600 }

/* ---------- ô nhờ trợ lý */
.ask{ width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:18px;
  background:var(--surface); box-shadow:0 0 0 1px var(--line); text-align:left; color:var(--muted) }
.ask .spark{ width:30px; height:30px; border-radius:10px; background:var(--jade); color:var(--jade-ink); display:grid; place-items:center; flex:none }
.chips{ display:flex; gap:8px; overflow-x:auto; padding:10px 2px 2px; scrollbar-width:none }
.chips::-webkit-scrollbar{ display:none }
.chip{ flex:none; padding:8px 13px; border-radius:999px; background:var(--surface); box-shadow:0 0 0 1px var(--line); font-size:13.5px; font-weight:500; white-space:nowrap }
.chip.on{ background:var(--text); color:var(--bg); box-shadow:none }

/* ---------- đội agent (điểm nhấn) */
.crew{ display:flex; gap:14px; overflow-x:auto; padding:4px 2px 6px; scrollbar-width:none }
.crew::-webkit-scrollbar{ display:none }
.mate{ flex:none; width:64px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:500 }
.ring{ position:relative; width:58px; height:58px }
.ring svg.r{ position:absolute; inset:0; transform:rotate(-90deg) }
.ring .core{ position:absolute; inset:5px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 1px var(--line); display:grid; place-items:center; color:var(--text) }
.ring circle.track{ stroke:var(--line) }
.ring circle.arc{ stroke:var(--jade); stroke-dasharray:0 200; transition:stroke-dasharray .5s ease }
.mate.ok circle.arc{ stroke-dasharray:166 200 }
.mate.off circle.arc{ stroke:var(--muted); stroke-dasharray:24 8 }
.mate.busy svg.r{ animation:spin 1.1s linear infinite }
.mate.busy circle.arc{ stroke-dasharray:60 200 }
.mate .nm{ text-align:center; line-height:1.2; max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
@keyframes spin{ to{ transform:rotate(270deg) } }

/* ---------- thẻ */
.card{ background:var(--surface); border-radius:var(--r-card); box-shadow:0 0 0 1px var(--line) }
.pad{ padding:16px }
.urgent{ border-left:4px solid var(--amber) }
.todo{ display:flex; gap:12px; padding:12px 16px; border-top:1px solid var(--line) }
.todo .grow{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.todo:first-child{ border-top:0 }
.src{ flex:none; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:8px; height:max-content; margin-top:2px }
.src.email{ background:var(--fill) } .src.lark{ background:var(--jade-soft); color:var(--jade) }
.muted{ color:var(--muted) } .small{ font-size:13px }
.empty{ padding:22px 16px; color:var(--muted); font-size:14px }

/* lịch */
.seg{ display:inline-flex; padding:3px; border-radius:12px; background:var(--fill) }
.seg button{ padding:6px 12px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted) }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08) }
.tl{ padding:6px 16px 12px }
.ev{ display:grid; grid-template-columns:64px 14px 1fr; gap:10px; align-items:start; padding:9px 0 }
.ev .t{ font-variant-numeric:tabular-nums; font-weight:600; font-size:14px }
.ev .t small{ display:block; color:var(--muted); font-weight:500; font-size:12px }
.ev .dot{ width:10px; height:10px; border-radius:50%; background:var(--jade); margin-top:6px; box-shadow:0 0 0 4px var(--jade-soft) }
.ev.past .dot{ background:var(--muted); box-shadow:none } .ev.past .ttl{ color:var(--muted) }
.ev .ttl{ font-weight:500 }

/* tin */
.rail{ display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 6px; scrollbar-width:none }
.rail::-webkit-scrollbar{ display:none }
.news{ flex:none; width:82%; scroll-snap-align:start; display:flex; flex-direction:column; gap:10px }
.topic{ align-self:flex-start; font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; background:var(--jade-soft); color:var(--jade) }
.news h3{ font-size:16.5px; line-height:1.35; font-weight:600; margin:0; letter-spacing:-.01em }
.news .sum{ color:var(--text); opacity:.82; margin:0; font-size:14.5px }
.news .why{ font-size:13.5px; color:var(--muted); margin:0 }
.row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.grow{ flex:1; min-width:0 }

/* nút */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 15px; border-radius:var(--r-ctl);
  background:var(--fill); font-weight:600; font-size:14px; white-space:nowrap }
.btn.pri{ background:var(--jade); color:var(--jade-ink) }
.btn.full{ width:100%; padding:14px; font-size:15px }
.btn:disabled{ opacity:.45 }
.btn svg{ width:17px; height:17px }

/* danh sách */
.list > *{ display:flex; gap:12px; align-items:center; padding:13px 16px; width:100%; text-align:left; border-top:1px solid var(--line) }
.list > *:first-child{ border-top:0 }
.thumb{ width:46px; height:46px; border-radius:12px; background:var(--fill); flex:none; object-fit:cover; display:grid; place-items:center; color:var(--muted) }
.ttl2{ font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }
.meta{ color:var(--muted); font-size:12.5px; margin-top:2px }
.badge{ font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:8px; flex:none }
.badge.draft{ background:var(--amber-soft); color:var(--amber) }
.badge.shared{ background:var(--fill); color:var(--muted) }
.badge.posted{ background:var(--jade-soft); color:var(--jade) }
.chev{ color:var(--muted); flex:none }
.st{ width:9px; height:9px; border-radius:50%; flex:none; background:var(--muted) }
.st.ok{ background:var(--jade) } .st.no{ background:var(--amber) }

/* studio lưới */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px }
.tile{ text-align:left; display:flex; flex-direction:column; overflow:hidden }
.tile .pic{ aspect-ratio:4/5; background:var(--fill); position:relative; overflow:hidden }
.tile .pic img{ width:100%; height:100%; object-fit:cover; display:block }
.tile .pic .play{ position:absolute; inset:0; display:grid; place-items:center }
.tile .pic .play span{ width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:grid; place-items:center }
.tile .pic .glyph{ position:absolute; inset:0; display:grid; place-items:center; color:var(--muted) }
.tile .info{ padding:10px 12px 12px }
.tile .badge{ position:absolute; top:8px; left:8px }

/* trợ lý */
.chat{ display:flex; flex-direction:column; gap:10px; padding-bottom:84px }
.msg{ max-width:86%; padding:11px 14px; border-radius:18px; white-space:pre-wrap; word-wrap:break-word; font-size:14.5px }
.msg.me{ align-self:flex-end; background:var(--jade); color:var(--jade-ink); border-bottom-right-radius:6px }
.msg.bot{ align-self:flex-start; background:var(--surface); box-shadow:0 0 0 1px var(--line); border-bottom-left-radius:6px }
.typing span{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:4px; animation:blink 1s infinite }
.typing span:nth-child(2){ animation-delay:.15s } .typing span:nth-child(3){ animation-delay:.3s }
@keyframes blink{ 50%{ opacity:.25 } }
.composer{ position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + var(--safe-b)); padding:10px 12px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:9 }
.composer form{ max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:flex-end }
.composer textarea{ flex:1; resize:none; max-height:120px; min-height:44px; padding:11px 14px; border-radius:22px; border:0; box-shadow:0 0 0 1px var(--line); background:var(--surface); color:var(--text); font:inherit }
.send{ width:44px; height:44px; border-radius:50%; background:var(--jade); color:var(--jade-ink); display:grid; place-items:center; flex:none }
.hello{ text-align:left; padding:8px 2px 4px }
.hello p{ color:var(--muted); margin:6px 0 14px }
.sug{ display:flex; flex-direction:column; gap:8px }
.sug button{ text-align:left; padding:12px 14px; border-radius:14px; background:var(--surface); box-shadow:0 0 0 1px var(--line); font-weight:500 }

/* nav */
nav{ position:fixed; left:0; right:0; bottom:0; z-index:10; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b);
  display:flex; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line) }
nav button{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:600; color:var(--muted) }
nav button svg{ width:23px; height:23px }
nav button.on{ color:var(--jade) }

/* sheet */
.scrim{ position:fixed; inset:0; background:rgba(8,10,12,.42); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s }
.scrim.on{ opacity:1; pointer-events:auto }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:21; max-height:92vh; overflow:auto; background:var(--bg);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0; padding:8px 16px calc(20px + var(--safe-b)); transform:translateY(102%); transition:transform .26s cubic-bezier(.2,.8,.2,1) }
.sheet.on{ transform:none }
.sheet .grab{ width:40px; height:5px; border-radius:9px; background:var(--line); margin:4px auto 12px }
.sheet h2{ font-size:20px; margin-bottom:4px }
.sheet .lead{ color:var(--muted); margin:0 0 16px; font-size:14px }
.field{ display:block; margin-bottom:14px }
.field span{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px }
.field input[type=text], .field input[type=number], .field input[type=password], .field textarea, .field select{
  width:100%; padding:12px 14px; border-radius:14px; border:0; box-shadow:0 0 0 1px var(--line); background:var(--surface); color:var(--text); font:inherit }
.field textarea{ min-height:120px; resize:vertical }
.media{ width:100%; border-radius:16px; display:block; margin-bottom:14px; background:var(--fill) }
img.media{ max-height:46vh; object-fit:contain } video.media{ max-height:60vh }
.out{ white-space:pre-wrap; padding:14px 16px; margin-top:12px }
.pick{ display:flex; gap:12px; align-items:center; padding:13px 14px; border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--line); margin-bottom:8px }
.pick input{ width:21px; height:21px; accent-color:var(--jade) }
details summary{ cursor:pointer; color:var(--jade); font-weight:600; font-size:14px; margin:4px 0 8px }

/* trạng thái */
.jobs{ position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:15; display:none; gap:8px; align-items:center;
  padding:8px 14px 8px 10px; border-radius:999px; background:var(--text); color:var(--bg); font-size:13px; font-weight:600; max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.spin{ width:15px; height:15px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:rot .8s linear infinite; flex:none }
@keyframes rot{ to{ transform:rotate(360deg) } }
.toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); transform:translateX(-50%); z-index:30; display:none;
  background:var(--text); color:var(--bg); padding:11px 16px; border-radius:14px; font-size:14px; font-weight:500; max-width:90vw }
.center{ display:grid; place-items:center; min-height:72vh; text-align:center; padding:24px; color:var(--muted) }
.skel{ height:14px; border-radius:7px; background:var(--fill); margin:8px 0 }

/* ---------- ưu tiên (ma trận Eisenhower) */
:root{ --p-red:#E5484D; --p-orange:#EE8A2A; --p-blue:#3A7BEF; --p-normal:var(--muted) }
.ev{ position:relative }
.ev .dot.red{ background:var(--p-red); box-shadow:0 0 0 4px color-mix(in srgb,var(--p-red) 18%,transparent) }
.ev .dot.orange{ background:var(--p-orange); box-shadow:0 0 0 4px color-mix(in srgb,var(--p-orange) 18%,transparent) }
.ev .dot.blue{ background:var(--p-blue); box-shadow:0 0 0 4px color-mix(in srgb,var(--p-blue) 18%,transparent) }
.ev .dot.normal{ background:var(--muted); box-shadow:none }
.ev button.ttl{ text-align:left; font-weight:500 }
.addlink{ color:var(--jade); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:4px }
.matrix{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px }
.mx{ text-align:left; padding:12px; border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--line); display:flex; gap:10px; align-items:flex-start }
.mx i{ width:14px; height:14px; border-radius:50%; flex:none; margin-top:3px }
.mx b{ display:block; font-size:14px } .mx small{ color:var(--muted); font-size:12px }
.mx.on{ box-shadow:0 0 0 2px var(--text) }
.nl{ display:flex; gap:8px; margin-bottom:16px }
.nl input{ flex:1; padding:12px 14px; border-radius:14px; border:0; box-shadow:0 0 0 1px var(--line); background:var(--surface); color:var(--text); font:inherit }
.inrow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px }
.inrow input[type=date], .inrow input[type=time]{ padding:9px 12px; border-radius:12px; border:0; box-shadow:0 0 0 1px var(--line); background:var(--surface); color:var(--text); font:inherit }
.lbl{ font-size:13px; font-weight:600; color:var(--muted); margin:0 0 8px }

/* ---------- superHuy: biểu đồ (bảng màu đã kiểm tra mù màu, sáng + tối) */
:root{ --s-red:#e34948; --s-blue:#2a78d6; --s-yellow:#eda100; --s-aqua:#1baf7a; --s-orange:#eb6834; --s-crit:#d03b3b }
html[data-scheme="dark"]{ --s-red:#e66767; --s-blue:#3987e5; --s-yellow:#c98500; --s-aqua:#199e70; --s-orange:#d95926; --s-crit:#d03b3b }
.kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
.kpi{ padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:2px }
.kpi b{ font-size:26px; line-height:1.1; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums }
.kpi span{ color:var(--muted); font-size:12.5px; font-weight:500 }
.kpi.warn b{ color:var(--danger) }
.hero{ padding:18px 16px 16px }
.hero .big{ font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums }
.hero .sub{ color:var(--muted); font-size:13.5px; margin-top:4px }
.meter{ height:8px; border-radius:4px; background:var(--fill); overflow:hidden; margin-top:12px }
.meter i{ display:block; height:100%; border-radius:4px; background:var(--jade) }
.meter i.over{ background:var(--s-crit) } .meter i.near{ background:var(--s-yellow) }
.sbar{ display:flex; gap:2px; height:14px; margin:14px 0 10px }
.sbar i{ display:block; height:100%; min-width:4px }
.sbar i:first-child{ border-radius:4px 0 0 4px } .sbar i:last-child{ border-radius:0 4px 4px 0 } .sbar i:only-child{ border-radius:4px }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px }
.legend span{ display:inline-flex; align-items:center; gap:6px } .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block }
.legend b{ font-variant-numeric:tabular-nums }
.chart{ padding:14px 16px 12px }
.chart h3{ margin:0 0 2px; font-size:15px; font-weight:600 } .chart .cap{ color:var(--muted); font-size:12.5px; margin:0 0 10px }
.chart svg text{ fill:var(--muted); font-size:10.5px; font-family:inherit }
.chart svg .base{ stroke:var(--line) }
.tipline{ min-height:18px; font-size:12.5px; color:var(--text); font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums }
[data-tip]{ cursor:pointer }
.hb{ display:grid; grid-template-columns:minmax(84px,34%) 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:13.5px }
.hb .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.hb .tr{ position:relative; height:10px; border-radius:4px; background:var(--fill) }
.hb .tr i{ position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--jade) }
.hb .tr i.over{ background:var(--s-crit) }
.hb .tr u{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); border-radius:1px }
.hb .v{ font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; text-align:right; min-width:52px }
/* việc */
.trow{ display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-top:1px solid var(--line); width:100%; text-align:left }
.trow:first-child{ border-top:0 }
.tick{ width:22px; height:22px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--muted); flex:none; margin-top:1px; display:grid; place-items:center; color:transparent }
.tick.on{ background:var(--jade); box-shadow:none; color:var(--jade-ink) }
.tick.doing{ box-shadow:inset 0 0 0 2px var(--s-yellow) }
.trow.done .tt{ color:var(--muted); text-decoration:line-through }
.tt{ font-weight:500 }
.tmeta{ display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; margin-top:4px; font-size:12.5px; color:var(--muted) }
.tmeta .late{ color:var(--danger); font-weight:600 } .tmeta .today{ color:var(--amber); font-weight:600 }
.sx{ font-size:11px; font-weight:600; padding:2px 7px; border-radius:7px; background:var(--fill); color:var(--muted) }
.sx.lark{ background:var(--jade-soft); color:var(--jade) }
.grp{ font-size:12.5px; font-weight:600; color:var(--muted); margin:18px 4px 8px; display:flex; justify-content:space-between }
.grp.late{ color:var(--danger) }
.review{ display:flex; gap:12px; align-items:center; padding:14px 16px; margin-top:12px; border-left:4px solid var(--amber); width:100%; text-align:left }
div.pick{ max-height:220px; overflow:auto; margin:-4px 0 14px; display:flex; flex-direction:column }
div.pick button{ display:flex; width:100%; text-align:left; padding:10px 12px; border-radius:12px; gap:10px; align-items:center }
div.pick button.on{ background:var(--jade-soft); color:var(--jade); font-weight:600 }
.av{ width:30px; height:30px; border-radius:50%; background:var(--fill); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none }
.tsug{ padding:12px 16px; border-top:1px solid var(--line) } .tsug:first-child{ border-top:0 }
/* tài chính */
.mnav{ display:flex; align-items:center; gap:4px; color:var(--muted); font-size:13px; font-weight:500 }
.mnav button{ padding:2px 6px; color:var(--muted) }
.txrow{ display:flex; gap:12px; align-items:center; padding:11px 16px; border-top:1px solid var(--line); width:100%; text-align:left }
.txrow:first-child{ border-top:0 }
.txrow .ic{ width:36px; height:36px; border-radius:11px; background:var(--fill); display:grid; place-items:center; font-size:17px; flex:none }
.amt{ font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap }
.amt.in{ color:var(--jade) }
.cats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px }
.cats button{ padding:10px 4px; border-radius:14px; background:var(--surface); box-shadow:0 0 0 1px var(--line); font-size:11.5px; line-height:1.25; display:flex; flex-direction:column; align-items:center; gap:4px }
.cats button span{ font-size:20px } .cats button.on{ box-shadow:0 0 0 2px var(--text); font-weight:600 }
.ai-text{ white-space:pre-wrap; font-size:14px; line-height:1.6 }
.hstat{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px }
.mini{ padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:4px }

.mini small{ color:var(--muted); font-size:12px }

/* ---------- Phát triển */
.ringwrap{ display:flex; gap:16px; align-items:center; padding:16px }
.pring{ position:relative; width:76px; height:76px; flex:none }
.pring svg{ transform:rotate(-90deg) } .pring .trk{ stroke:var(--fill) } .pring .val{ stroke:var(--jade); transition:stroke-dasharray .4s }
.pring b{ position:absolute; inset:0; display:grid; place-items:center; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums }
.hrow{ display:flex; gap:12px; align-items:center; padding:12px 16px; border-top:1px solid var(--line); width:100% }
.hrow:first-child{ border-top:0 }
.hrow .tick{ width:28px; height:28px }
.fire{ font-size:12.5px; font-weight:600; color:var(--amber); white-space:nowrap }
.dots28{ display:grid; grid-template-columns:repeat(14, 1fr); gap:3px; margin-top:8px; max-width:230px }
.dots28 i{ aspect-ratio:1; border-radius:3px; background:var(--fill) } .dots28 i.on{ background:var(--jade) }
.goal{ padding:16px; display:block; width:100%; text-align:left }
.goal .pbar{ height:8px; border-radius:4px; background:var(--fill); margin:10px 0 6px; overflow:hidden } .goal .pbar i{ display:block; height:100%; background:var(--jade); border-radius:4px }
.blk{ display:grid; grid-template-columns:52px 1fr auto; gap:10px; align-items:start; padding:10px 16px; border-top:1px solid var(--line) }
.blk:first-child{ border-top:0 }
.blk .t{ font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px } .blk .t small{ display:block; color:var(--muted); font-weight:500; font-size:11.5px }
.blk .k{ font-size:11px; font-weight:600; padding:2px 7px; border-radius:7px; background:var(--fill); color:var(--muted); margin-right:6px }
.blk.fixed .ttl{ color:var(--muted) }
.blk input{ width:20px; height:20px; accent-color:var(--jade); margin-top:2px }
.fact{ display:flex; gap:10px; align-items:flex-start; padding:11px 16px; border-top:1px solid var(--line) } .fact:first-child{ border-top:0 }
.fact .x{ color:var(--muted); flex:none; padding:2px }
.acts{ align-self:flex-start; display:flex; flex-wrap:wrap; gap:6px; max-width:92%; margin-top:-4px }
.acts span{ font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:999px; background:var(--jade-soft); color:var(--jade) }
.acts span.err{ background:color-mix(in srgb, var(--danger) 12%, transparent); color:var(--danger) }
.homeTop{ display:flex; justify-content:space-between; align-items:flex-start }
.iconbtn{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--surface); box-shadow:0 0 0 1px var(--line); color:var(--text) }
.wide{ grid-column:1 / -1 }
/* khóa PIN */
#lock{ position:fixed; inset:0; z-index:60; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:24px 16px calc(24px + var(--safe-b)); user-select:none }
body.locked #lock{ display:flex } body.locked #app, body.locked #nav, body.locked .sheet, body.locked .scrim{ visibility:hidden }
#lock .mark{ width:60px; height:60px; border-radius:19px; background:var(--jade-soft); color:var(--jade); display:grid; place-items:center; margin-bottom:14px }
#lock h2{ margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em }
#lock .sub{ color:var(--muted); font-size:14px; margin:4px 0 24px; min-height:21px; text-align:center; max-width:300px }
#lock .sub.err{ color:var(--danger) }
.dots{ display:flex; gap:14px; margin-bottom:34px }
.dots i{ width:13px; height:13px; border-radius:50%; border:2px solid color-mix(in srgb, var(--muted) 70%, transparent); transition:background .12s, border-color .12s }
.dots i.on{ background:var(--jade); border-color:var(--jade) }
.dots.shake{ animation:shake .36s }
@keyframes shake{ 20%,60%{ transform:translateX(-9px) } 40%,80%{ transform:translateX(9px) } }
.keys{ display:grid; grid-template-columns:repeat(3,74px); gap:14px 24px }
.keys button{ width:74px; height:74px; border-radius:50%; background:var(--surface); font-size:27px; font-weight:500; display:grid; place-items:center;
  box-shadow:0 1px 2px color-mix(in srgb, var(--text) 8%, transparent) }
.keys button:active{ background:var(--fill); transform:scale(.96) }
.keys button.ghost{ background:none; box-shadow:none; font-size:14px; font-weight:600; color:var(--muted) }
.keys button:disabled{ opacity:.35 }
@media (max-height:620px){ .keys{ grid-template-columns:repeat(3,62px); gap:10px 22px } .keys button{ width:62px; height:62px; font-size:23px } .dots{ margin-bottom:22px } }
@media (prefers-reduced-motion:reduce){ .dots.shake{ animation:none } .keys button:active{ transform:none } }
/* ưu tiên + gợi ý AI */
.tags{ display:flex; gap:6px; flex-wrap:wrap }
.tag{ font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:8px; flex:none; line-height:1.4 }
.tag.hi{ background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger) }
.tag.mid{ background:var(--amber-soft); color:var(--amber) }
.tag.lo{ background:var(--fill); color:var(--muted) }
.tag.role{ background:var(--jade-soft); color:var(--jade) }
.aisug{ display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:var(--jade-soft); font-size:14px; line-height:1.45 }
.aisug svg{ color:var(--jade); flex:none; margin-top:2px }
/* lời mời họp */
.inv{ display:flex; gap:14px; padding:14px 16px; border-top:1px solid var(--line) } .inv:first-child{ border-top:0 }
.inv .d{ flex:none; width:74px; display:flex; flex-direction:column; font-size:13px; color:var(--muted); line-height:1.35 }
.inv .d b{ color:var(--text); font-size:14px; font-weight:600; white-space:nowrap } .inv .d span{ white-space:nowrap; font-size:12.5px }
.inv .t{ font-weight:600; line-height:1.35 }
.inv .warn{ color:var(--amber); font-size:13px; margin-top:4px }
.inv .rs{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap }
.inv.gone{ opacity:0; transform:translateX(30px); transition:opacity .25s, transform .25s }
.btn.sm{ padding:7px 12px; font-size:13.5px; border-radius:11px }
.note{ padding:12px 14px; border-radius:14px; background:var(--amber-soft); color:var(--text); font-size:14px; margin-bottom:14px }

/* ---------- hộp thư */
.stack{ position:relative; height:min(440px,52vh); min-height:340px; margin:6px 0 14px }
.mcard{ position:absolute; inset:0; padding:20px; display:flex; flex-direction:column; gap:12px; touch-action:pan-y; user-select:none; will-change:transform }
.mcard.back1{ transform:translateY(10px) scale(.96); opacity:.7 } .mcard.back2{ transform:translateY(20px) scale(.92); opacity:.4 }
.mcard .who{ display:flex; gap:12px; align-items:center }
.av{ width:42px; height:42px; border-radius:50%; background:var(--jade-soft); color:var(--jade); display:grid; place-items:center; font-weight:700; flex:none }

.mcard .sum{ font-size:15px; margin:0 } .mcard .body{ color:var(--muted); font-size:13.5px; overflow:hidden; flex:1; white-space:pre-wrap; mask-image:linear-gradient(#000 70%,transparent) }
.stamp{ position:absolute; top:22px; padding:6px 12px; border-radius:10px; font-weight:700; font-size:15px; opacity:0; border:2px solid }
.stamp.yes{ right:20px; color:var(--jade); border-color:var(--jade) } .stamp.no{ left:20px; color:var(--muted); border-color:var(--muted) }
.swipebar{ display:flex; justify-content:center; gap:28px; align-items:center }
.round{ width:62px; height:62px; border-radius:50%; background:var(--surface); box-shadow:0 0 0 1px var(--line), 0 6px 18px rgba(0,0,0,.08); display:grid; place-items:center }
.round.yes{ background:var(--jade); color:var(--jade-ink); box-shadow:0 6px 18px color-mix(in srgb,var(--jade) 35%,transparent) }
.round svg{ width:26px; height:26px }
.lb{ font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:8px; background:var(--fill); color:var(--text) }
.lb.Work{ background:color-mix(in srgb,#3A7BEF 15%,transparent); color:#3A7BEF } .lb.Learning{ background:color-mix(in srgb,#8B5CF6 15%,transparent); color:#8B5CF6 }
.lb.Personal{ background:color-mix(in srgb,#EC4899 15%,transparent); color:#EC4899 } .lb.Important{ background:color-mix(in srgb,#E5484D 15%,transparent); color:#E5484D }
.lb.Finance{ background:var(--amber-soft); color:var(--amber) } .lb.Promotion{ background:var(--fill); color:var(--muted) }
.fab{ position:fixed; right:18px; bottom:calc(var(--nav-h) + var(--safe-b) + 16px); z-index:9; height:52px; padding:0 20px; border-radius:26px; background:var(--jade); color:var(--jade-ink);
  display:flex; align-items:center; gap:8px; font-weight:600; box-shadow:0 8px 22px color-mix(in srgb,var(--jade) 40%,transparent) }
.done{ text-align:center; padding:60px 20px; color:var(--muted) } .done b{ display:block; color:var(--text); font-size:18px; margin-bottom:6px }
/* ---------- nội dung */
.trk{ align-self:flex-start; font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; white-space:nowrap }
.trk.tin{ background:var(--jade-soft); color:var(--jade) }
.trk.founder{ background:color-mix(in srgb,#7C5CE0 15%,transparent); color:#7C5CE0 }
html[data-scheme="dark"] .trk.founder{ color:#A993F5 }
.trk.tay{ background:var(--amber-soft); color:var(--amber) }
.ccard .sum{ display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden }
.wk{ display:flex; gap:12px; align-items:center; padding:12px 16px; border-top:1px solid var(--line) } .wk:first-child{ border-top:0 }
.wk .spin{ flex:none }
.chip.rm{ display:inline-flex; align-items:center; gap:6px }
video.media.reel{ aspect-ratio:9/16; max-height:62vh; width:auto; display:block; margin:0 auto 12px; background:#000 }
/* ---------- Họp */
:root{ --rec:#E5484D; --rec-soft:color-mix(in srgb,#E5484D 13%,transparent) }
.recpad{ display:flex; gap:16px; align-items:center; padding:18px; border-radius:var(--r-card); background:var(--surface); box-shadow:0 0 0 1px var(--line); margin:4px 0 12px }
.recbtn{ flex:none; width:68px; height:68px; border-radius:50%; background:var(--rec-soft); display:grid; place-items:center; position:relative }
.recbtn .dot{ width:44px; height:44px; border-radius:50%; background:var(--rec); box-shadow:0 6px 18px color-mix(in srgb,var(--rec) 45%,transparent); transition:transform .15s }
.recbtn:active .dot{ transform:scale(.9) }
.srcrow{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px }
.src{ display:flex; gap:10px; align-items:center; padding:12px 13px; border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--line); font-size:13.5px; font-weight:500; text-align:left; line-height:1.3 }
.src svg{ flex:none; color:var(--muted) }
.askbar{ display:flex; gap:8px; align-items:center; padding:6px 6px 6px 12px; border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--line); margin-bottom:12px }
.askbar .ic{ color:var(--jade); display:grid; place-items:center } .askbar input{ flex:1; min-width:0; border:0; background:transparent; color:var(--text); font:inherit; padding:8px 0; outline:none }
.ans{ margin:-4px 0 14px } .ans .atext{ white-space:pre-wrap; font-size:15px; line-height:1.5 }
.srcs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px }
.tchip{ flex:none; display:inline-flex; gap:4px; align-items:center; font-size:12px; font-weight:600; padding:4px 8px; border-radius:8px; background:var(--jade-soft); color:var(--jade); white-space:nowrap; font-variant-numeric:tabular-nums; align-self:flex-start }
.org{ font-size:12px; font-weight:600; padding:3px 8px; border-radius:7px; background:var(--fill) }
.org.sellnity{ background:var(--jade-soft); color:var(--jade) } .org.leversphere{ background:color-mix(in srgb,#7C5CE0 15%,transparent); color:#7C5CE0 }
html[data-scheme="dark"] .org.leversphere{ color:#A993F5 } .org.ca-nhan{ background:var(--amber-soft); color:var(--amber) }
.mrow{ align-items:flex-start!important } .clamp2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.pbar{ height:6px; border-radius:3px; background:var(--fill); overflow:hidden; margin:8px 0 6px } .pbar.big{ height:8px; margin:12px 0 }
.pbar span{ display:block; height:100%; background:var(--jade); border-radius:3px; transition:width .6s ease }
.back{ display:inline-flex; align-items:center; gap:2px; color:var(--jade); font-weight:600; font-size:15px; margin:2px 0 4px -4px } .back svg{ transform:rotate(180deg) }
.player{ position:sticky; top:0; z-index:5; margin:12px -4px 0; padding:10px 4px 8px; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px) }
.player audio{ width:100%; height:40px }
.spd{ font-size:12.5px; font-weight:600; padding:4px 9px; border-radius:8px; background:var(--fill); font-variant-numeric:tabular-nums } .spd.on{ background:var(--text); color:var(--bg) }
.mblk{ border-radius:var(--r-card); background:var(--surface); box-shadow:0 0 0 1px var(--line); padding:14px 16px 6px; margin-bottom:12px; border-left:4px solid var(--c, var(--line)) }
.mblk h3{ display:flex; gap:8px; align-items:center; margin:0 0 6px; font-size:15px } .mblk h3 svg{ color:var(--c) }
.mblk.dec{ --c:#199e70 } .mblk.nxt{ --c:#2a78d6 } .mblk.sgt{ --c:#c98500 } .mblk.opn{ --c:var(--muted) }
.mblk ul, .flow ul{ list-style:none; margin:0; padding:0 } .mblk li, .flow li{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); font-size:14.5px; line-height:1.45 }
.mblk li:first-child, .flow li:first-child{ border-top:0 }
.flow{ margin-bottom:10px } .flow h3{ margin:0; font-size:15px }
.spkrow{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px }
.spk{ display:inline-flex; gap:6px; align-items:center; padding:6px 10px; border-radius:999px; background:var(--surface); box-shadow:0 0 0 1px var(--line); font-size:13px; font-weight:600 }
.spk i{ width:9px; height:9px; border-radius:50%; background:var(--c) } .spk svg{ color:var(--muted) }
.tx{ display:flex; flex-direction:column; gap:2px }
.ln{ display:flex; gap:12px; padding:9px 10px; border-radius:12px; cursor:pointer } .ln:active{ background:var(--fill) }
.ln.on{ background:var(--jade-soft) } .ln .tt{ flex:none; width:46px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px }
.ln b{ font-size:13px } .ln p{ margin:2px 0 0; font-size:14.5px; line-height:1.5 }
.tline{ display:flex; gap:2px; height:34px; border-radius:10px; overflow:hidden; margin-bottom:10px }
.tline button{ min-width:8px; background:color-mix(in srgb,var(--c) 70%,transparent); position:relative; overflow:hidden }
.tline button span{ position:absolute; left:6px; right:4px; top:50%; transform:translateY(-50%); font-size:11px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left }
.tlist{ display:flex; flex-direction:column; margin-bottom:6px } .tlist button{ display:flex; gap:10px; align-items:center; padding:8px 2px; font-size:14px; text-align:left; border-top:1px solid var(--line) }
.tlist button:first-child{ border-top:0 } .tlist i{ width:10px; height:10px; border-radius:3px; flex:none }
.mmap{ overflow-x:auto; padding:6px 2px 12px; margin:0 -4px; -webkit-overflow-scrolling:touch }
.mmap svg{ display:block } .mlink{ fill:none; stroke:var(--line); stroke-width:2; stroke:color-mix(in srgb,var(--text) 22%,transparent) }
.mnode rect{ fill:var(--surface); stroke:color-mix(in srgb,var(--text) 14%,transparent); stroke-width:1 }
.mnode text{ fill:var(--text); font-size:13px; font-family:inherit } .mnode text.mt{ fill:var(--jade); font-size:11px; font-weight:600 }
.mnode.d0 rect{ fill:var(--jade); stroke:none } .mnode.d0 text{ fill:var(--jade-ink); font-weight:700; font-size:14px }
.mnode.d1 rect{ fill:var(--jade-soft); stroke:none } .mnode.d1 text{ font-weight:600 }
.mnode.click{ cursor:pointer } .mnode.click:active rect{ stroke:var(--jade); stroke-width:2 }
.recview{ padding:20px 0 10px } .rtime{ text-align:center; font-size:56px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:18px 0 8px }
.rwave{ width:100%; height:90px; display:block; margin:0 0 18px }
.recstop{ width:78px; height:78px; border-radius:50%; background:var(--rec-soft); display:grid; place-items:center }
.recstop span{ width:30px; height:30px; border-radius:8px; background:var(--rec) }
/* bong bóng trợ lý */
#dock{ position:fixed; right:16px; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); z-index:20 }
.bubble{ width:56px; height:56px; border-radius:50%; background:var(--jade); color:var(--jade-ink); display:grid; place-items:center; box-shadow:0 8px 24px color-mix(in srgb,var(--jade) 40%,transparent), 0 0 0 1px color-mix(in srgb,#000 6%,transparent); position:relative }
.bubble .ping{ position:absolute; top:4px; right:4px; width:12px; height:12px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 2px var(--bg) }
.dpanel{ width:min(380px, calc(100vw - 32px)); height:min(520px, 62vh); display:flex; flex-direction:column; border-radius:22px; background:var(--bg); box-shadow:0 18px 50px rgba(0,0,0,.22), 0 0 0 1px var(--line); overflow:hidden }
.dhead{ display:flex; gap:8px; align-items:center; padding:10px 10px 10px 14px; background:var(--surface); border-bottom:1px solid var(--line) }
.dav{ width:28px; height:28px; border-radius:9px; background:var(--jade); color:var(--jade-ink); display:grid; place-items:center }
.iconbtn.sm{ width:34px; height:34px; border-radius:10px; box-shadow:none; background:var(--fill) }
.dmsgs{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px } .dmsgs .msg{ font-size:14px }
.dform{ display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--surface) }
.dform input{ flex:1; min-width:0; padding:10px 14px; border-radius:20px; border:0; box-shadow:0 0 0 1px var(--line); background:var(--bg); color:var(--text); font:inherit }
body.locked #dock, body:has(#sheet.on) #dock{ display:none }

@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important } }
/* =================================================================== superHuy aura (giao diện super app) */
:root{
  --bg:#F4F1F8; --surface:#FFFFFF; --text:#1B1724; --muted:#7A7387;
  --line:color-mix(in srgb, #2A1A45 9%, transparent); --fill:color-mix(in srgb, #4A2C7A 7%, transparent);
  --jade:#A2338C; --jade-ink:#FFFFFF; --jade-soft:color-mix(in srgb, #A2338C 11%, transparent);
  --aura:linear-gradient(135deg,#7B5CF0 0%,#C13F96 100%);
  --sh:0 1px 2px rgba(40,20,70,.05), 0 8px 24px rgba(70,35,120,.07);
  --r-card:24px; --r-ctl:16px; --r-sheet:28px; --nav-h:76px;
}
html[data-scheme="dark"]{
  --bg:#131019; --surface:#1E1A26; --text:#F2EEF7; --muted:#9C94AA;
  --line:color-mix(in srgb, #FFFFFF 9%, transparent); --fill:color-mix(in srgb, #FFFFFF 7%, transparent);
  --jade:#EA7CC8; --jade-ink:#2A0B21; --jade-soft:color-mix(in srgb, #EA7CC8 14%, transparent);
  --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
html,body{ background:var(--bg) }
body::before{ content:""; position:fixed; inset:0 0 auto 0; height:420px; z-index:-1; pointer-events:none;
  background:radial-gradient(60% 70% at 12% 0%, color-mix(in srgb,#7B5CF0 16%,transparent), transparent 70%),
             radial-gradient(55% 60% at 92% 4%, color-mix(in srgb,#C13F96 14%,transparent), transparent 72%) }
body{ padding-bottom:calc(var(--nav-h) + var(--safe-b) + 28px) }
.card, .ask, .chip, .src, .askbar, .recpad, .spk, .pick, .iconbtn, .sug button{ box-shadow:var(--sh) }
.card{ border-radius:var(--r-card) }

<body>
<div class="jobs" id="jobs"></div>
<div class="toast" id="toast" role="status"></div>
<section id="lock" aria-label="Mở khóa superHuy"><div class="mark" id="lockMark"></div><h2>superHuy</h2><p class="sub" id="lockSub" role="status">Nhập mã PIN</p><div class="dots" id="dots" aria-hidden="true"></div><div class="keys" id="keys"></div></section>
<main class="wrap" id="app"><div class="center"><div class="spin" style="color:var(--jade)"></div></div></main>

<script>
/* QC: gửi lỗi giao diện về bot để báo ngay cho chủ nhân (chỉ nội dung lỗi, không gửi dữ liệu) */
(function(){ let n=0; const send = (msg, src, line) => { if(n++ > 5) return;
  try{ fetch('/api/clienterror', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({msg:String(msg).slice(0,300), src:String(src||'').slice(-80), line:String(line||'')})}).catch(()=>{}); }catch(e){} };
  window.addEventListener('error', e => { if(e && e.message) send(e.message, e.filename, e.lineno); });
  window.addEventListener('unhandledrejection', e => { const m = (e.reason && (e.reason.message||e.reason)) || 'unhandled'; if(!/Mất kết nối|Đã khóa|Phiên hết hạn|mã PIN/.test(String(m))) send(m, 'promise', ''); });
})();
const tg = window.Telegram?.WebApp;
const S = { tok:null, tab:'home', data:{}, jobs:{}, busy:{}, kind:'', calDay:'today', cal:{}, chatWait:false, first:'' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic = (t='light') => { try{ tg?.HapticFeedback?.impactOccurred(t) }catch(e){} };
const notifyH = t => { try{ tg?.HapticFeedback?.notificationOccurred(t) }catch(e){} };

/* ---------- biểu tượng (nét mảnh, đồng bộ) */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h4"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>',
  studio:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9.5 5 2.5-5 2.5z"/>',
  more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
  lark:'<path d="M4 6h16v10H10l-4 3v-3H4z"/><path d="M8 10h8M8 13h5"/>',
  brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 3 5 3 3 0 0 0 5 1V5a3 3 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-3 5 3 3 0 0 1-5 1"/>',
  send:'<path d="M4 12 20 4l-4 16-4-7z"/><path d="m12 13 8-9"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', save:'<path d="M6 4h12v16l-6-4-6 4z"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.8"/><path d="m21 16-5-5-9 9"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  play:'<path d="M8 5v14l11-7z"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>', upload:'<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>', video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3z"/>', pause:'<path d="M8 5v14M16 5v14"/>', check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  del:'<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m12 9 6 6M18 9l-6 6"/>', reply:'<path d="M10 8 4 13l6 5"/><path d="M4 13h10a6 6 0 0 1 6 6"/>', inbox:'<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>', layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>', sprout:'<path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z"/>', tasks:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', wallet:'<path d="M4 7a2 2 0 0 1 2-2h11v4"/><rect x="4" y="9" width="17" height="11" rx="2"/><path d="M16 14.5h2"/>', chart:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>', back:'<path d="m15 6-6 6 6 6"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
const ico = (n, w=22) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||P.spark}</svg>`;
const AGENT_ICON = { phattrien:'sprout', viec:'tasks', taichinh:'wallet', lich:'calendar', email:'mail', lark:'lark', tin:'news', studio:'studio', noidung:'studio', hop:'mic', dang:'send', brain:'brain', caidat:'gear' };
const KIND = { post:['Bài viết','pen'], bantin:['Ảnh bản tin','image'], video:['Video','film'], note:['Ghi chú','save'] };

/* ---------- tiện ích */
function toast(m, ms=2600){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }
async function api(path, body){
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json','X-Session':S.tok||''}, body:JSON.stringify(body)} : {headers:{'X-Session':S.tok||''}};
  let r; try{ r = await fetch(path, opt); }catch(e){ throw new Error('Mất kết nối tới bot. Đóng app và bấm “Mở app” trong chat để mở lại.'); }
  const j = await r.json().catch(()=>({error:'Phản hồi không hợp lệ'}));
  if(r.status===401){ if(S.tok && path!=='/api/pin'){ relock(); throw new Error('Đã khóa, nhập mã PIN để tiếp tục'); } throw new Error(j.error||'Phiên hết hạn'); }
  if(j.error) throw new Error(j.error);
  return j;
}
async function run(agent, action, params={}, label='', quiet=false){
  if(!quiet) haptic();
  const j = await api('/api/run', {agent, action, params});
  return j.job ? waitJob(j.job, label||action, agent, quiet) : j.result;
}
function waitJob(id, label, agent, quiet=false){
  if(!quiet){ S.jobs[id] = label; if(agent){ S.busy[agent]=(S.busy[agent]||0)+1; } paintBusy(); }
  return new Promise((ok, fail)=>{
    const done = () => { if(quiet) return; delete S.jobs[id]; if(agent){ S.busy[agent]--; } paintBusy(); };
    const tick = async ()=>{
      try{
        const j = await api('/api/job?id='+id);
        if(j.status==='running') return setTimeout(tick, 1600);
        done();
        if(j.status==='done'){ if(!quiet) notifyH('success'); ok(j.result); } else { if(!quiet) notifyH('error'); fail(new Error(j.error||'Có lỗi')); }
      }catch(e){ done(); fail(e); }
    };
    setTimeout(tick, 900);
  });
}
function paintBusy(){
  const names = Object.values(S.jobs), el = $('#jobs');
  el.style.display = names.length ? 'flex' : 'none';
  el.innerHTML = names.length ? `<div class="spin"></div><span>${esc(names[names.length-1])}${names.length>1?` và ${names.length-1} việc khác`:''}</span>` : '';
  document.querySelectorAll('.mate').forEach(m => m.classList.toggle('busy', (S.busy[m.dataset.id]||0) > 0));
}
async function refresh(){ const keep = S.data; S.data = await api('/api/bootstrap'); S.data.chat = S.data.chat || keep.chat || []; render(); }
const fmtTime = iso => iso ? iso.slice(11,16) : '';
const viDate = d => d.toLocaleDateString('vi-VN', {weekday:'long', day:'numeric', month:'long'});
function openLink(u){ if(!u) return; tg?.openLink ? tg.openLink(u) : window.open(u, '_blank'); }
function copyText(t){
  const ok = () => { toast('Đã sao chép'); haptic('medium'); };
  const fb = () => { const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Không sao chép được'); } a.remove(); };
  navigator.clipboard?.writeText ? navigator.clipboard.writeText(t).then(ok).catch(fb) : fb();
}

/* ---------- điều hướng */
const TABS = [['home','Hôm nay','home'],['tasks','Việc','tasks'],['ai','superHuy','spark'],['meet','Họp','mic'],['growth','Phát triển','sprout']];
function nav(){
  const n = $('#nav'); n.hidden = false;
  n.innerHTML = TABS.map(([id,l,i]) => id==='ai' ? `<button data-t="ai" class="ai ${S.dockOpen||S.tab==='chat'?'on':''}" aria-label="Trò chuyện với superHuy"><span class="orb">${ico('spark',26)}</span><em>${l}</em></button>`
    : `<button data-t="${id}" class="${S.tab===id?'on':''}" aria-label="${l}">${ico(i)}<span>${l}</span></button>`).join('');
  n.querySelectorAll('button').forEach(b => b.onclick = () => b.dataset.t==='ai' ? aiToggle() : go(b.dataset.t));
}
function go(tab){ if(tab==='news'||tab==='studio'){ S.cview = tab==='news'?'duyet':'tao'; tab='content'; } if(S.tab!==tab) haptic('soft'); S.tab = tab; closeSheet(); render(); window.scrollTo(0,0); if(tab==='chat') setTimeout(()=>$('#msgIn')?.focus(), 200); }
function render(){
  nav();
  $('#app').innerHTML = ({home:vHome, meet:vMeet, mail:vMail, chat:vChat, content:vContent, news:vContent, studio:vContent, more:vMore, tasks:vTasks, money:vMoney, growth:vGrowth})[S.tab]();
  paintBusy();
  if(S.tab==='home'){ loadCal(true); loadInv(true); liveDigests(); loadHomeStats(); }
  if(S.tab==='tasks') tasksEnter();
  if(S.tab==='money') moneyEnter();
  if(S.tab==='growth') growthEnter();
  if(S.tab==='mail'){ mailEnter(); bindSwipe(); }
  if(S.tab==='content') contentEnter();
  if(S.tab==='meet'){ if(S.mt.rec) recTick(); else meetEnter(); }
  dock();
  
  if(S.tab==='chat'){ const c=$('.chat'); if(c) window.scrollTo(0, document.body.scrollHeight); bindComposer(); }
}

/* ---------- Hôm nay */
function urgentItems(){
  const out = [];
  for(const [k, d] of Object.entries(S.data.digests||{})){
    const lines = (d.text||'').split('\n'); let on = false;
    for(const raw of lines){
      const l = raw.trim();
      if(/^(\d\)\s*)?🔥/.test(l)){ on = true; continue; }
      if(on){
        if(!l) { if(out.filter(o=>o.k===k).length) break; else continue; }
        if(/^(\d\)\s*)?(📌|🏢|🗂|💬|🗑)/.test(l)) break;
        const t = l.replace(/^[•\-\d.)\s]+/, '');
        if(t && !/^không có/i.test(t) && !/(\S+)(\s+\1){4,}/.test(t)) out.push({k, t:t.slice(0,180), at:d.at});
      }
    }
  }
  return out.slice(0, 6);
}
function vHome(){
  const d = S.data, now = new Date(), h = now.getHours();
  const hi = h<11 ? 'Chào buổi sáng' : h<14 ? 'Chào buổi trưa' : h<18 ? 'Chào buổi chiều' : 'Chào buổi tối';
  const cqNew = (d.cq?.new||[]).slice(0,6), todo = urgentItems();
  const lastScan = Object.values(d.digests||{}).map(x=>x.at).sort().pop();
  const t = S.tk.data?.stats, g = S.gr?.data;
  const sum = [t?`<b>${t.today}</b> việc hôm nay`:'', g?`<b>${g.today_done}/${g.today_due}</b> thói quen`:'', todo.length?`<b>${todo.length}</b> mục cần anh`:''].filter(Boolean).join(' · ');

function paintCal(iso){
  const el = $('#cal'); if(!el) return;
  const cur = new Date(); if(S.calDay==='tomorrow') cur.setDate(cur.getDate()+1);
  if(cur.toLocaleDateString('sv-SE') !== iso || !S.cal[iso]) return;  // người dùng đã đổi ngày
  const r = S.cal[iso], now = new Date(), isToday = S.calDay==='today';

  S.evs = Object.fromEntries(evs.filter(v=>v.id).map(v=>[v.id, v]));
  $('#cal').innerHTML = evs.length ? `<div class="tl">${evs.map(v=>`<div class="ev ${v.past?'past':''}"><div class="t">${v.all_day?'Cả ngày':esc(v.start)}${v.end?`<small>${esc(v.end)}</small>`:''}</div><span class="dot ${v.priority||'normal'}"></span>

function bindSwipe(){
  const card = document.querySelector('.mcard:not(.back1):not(.back2)'); if(!card) return;
  let x0=null, dx=0;
  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  card.onpointerdown = e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition='none'; };
  card.onpointermove = e => { if(x0===null) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`; yes.style.opacity = Math.max(0, dx/110); no.style.opacity = Math.max(0, -dx/110); };
  card.onpointerup = card.onpointercancel = () => { if(x0===null) return; x0=null; card.style.transition='transform .25s ease';
    if(Math.abs(dx) > 110) swipeTop(dx>0?1:-1); else { card.style.transform=''; yes.style.opacity=0; no.style.opacity=0; } };
}
function swipeTop(dir){

    if(dir<0){ m.status='skipped'; run('email','boqua',{uid},'Đánh dấu đã đọc').catch(()=>{}); render(); }

/* upload: chia phần 8 MB, gửi tuần tự (đường hầm giới hạn 100 MB mỗi request) */
async function upPart(uid, seq, blob){
  for(let a=0; a<4; a++){
    try{
      const r = await fetch(`/api/upload?id=${uid}&seq=${seq}`, {method:'POST', headers:{'X-Session':S.tok||'', 'Content-Type':'application/octet-stream'}, body:blob});
      const j = await r.json().catch(()=>({}));
      if(r.ok && j.ok) return j;
      if(r.status===401){ relock(); throw new Error('Đã khoá, nhập PIN rồi thử lại'); }
      throw new Error(j.error||('Lỗi '+r.status));
    }catch(e){ if(a===3) throw e; await new Promise(ok=>setTimeout(ok, 1500*(a+1))); }
  }
}
async function meetUpload(file){
  if(!file) return;
  const uid = 'up'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), CH = 8*1024*1024, n = Math.ceil(file.size/CH);
  sheet(`<h2>Tải file ghi âm</h2><p class="lead">${esc(file.name)} · ${(file.size/1048576).toFixed(1)} MB</p>
    <label class="field"><span>Bối cảnh (không bắt buộc)</span><input type="text" id="uhint" placeholder="Ví dụ: họp Leversphere, dự án Growth Q4, có anh Nam bên đối tác"></label>
    <div class="pbar big"><span id="upb" style="width:0%"></span></div><p class="meta" id="upt">Đang tải lên…</p>`);
  try{
    for(let i=0;i<n;i++){ await upPart(uid, i, file.slice(i*CH, (i+1)*CH)); const p = Math.round((i+1)/n*100); const b=$('#upb'); if(b){ b.style.width=p+'%'; $('#upt').textContent=`Đã tải ${p}%`; } }
    const started = file.lastModified ? new Date(file.lastModified - 0).toISOString().slice(0,19) : '';
    const r = await run('hop','tao',{upload_id:uid, name:file.name, hint:$('#uhint')?.value||'', source:'Tải file'},'',true);
    closeSheet(); toast(r.text, 4000); S.mt.at = 0; meetEnter(true);
  }catch(e){ const t=$('#upt'); if(t){ t.textContent = 'Lỗi: '+e.message; t.style.color='var(--danger)'; } else toast(e.message); }
}

/* ghi âm trong app */
async function recStart(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Thiết bị này chưa cho ghi âm trong app. Anh dùng app ghi âm của máy rồi Tải file nhé.', 5000);
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:true, autoGainControl:true, channelCount:1}}); }
  catch(e){ return toast('Chưa có quyền dùng micro. Anh cho phép Telegram dùng micro trong Cài đặt của điện thoại rồi thử lại.', 6000); }
  const mime = ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported?.(t)) || '';
  const rec = new MediaRecorder(stream, mime?{mimeType:mime, audioBitsPerSecond:48000}:{});
  const R = S.mt.rec = { uid:'rec'+Date.now().toString(36), seq:0, queue:Promise.resolve(), rec, stream, t0:Date.now(), paused:0, pauseAt:0,
    started:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19), ext:(rec.mimeType||mime).includes('mp4')?'m4a':'webm', failed:0, sent:0 };
  rec.ondataavailable = e => { if(!e.data || !e.data.size) return; const seq = R.seq++; R.queue = R.queue.then(()=>upPart(R.uid, seq, e.data).then(()=>{ R.sent++; }).catch(()=>{ R.failed++; })); };
  rec.start(10000);
  try{ R.wake = await navigator.wakeLock?.request('screen'); }catch(e){}
  const ctx = new (window.AudioContext||window.webkitAudioContext)(), an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(stream).connect(an); R.ctx = ctx; R.an = an;
  haptic('medium'); render(); recTick();
}
function recTick(){
  const R = S.mt.rec; if(!R) return; cancelAnimationFrame(R.raf);
  const el = $('#rtime'); if(el){ const s = ((R.pauseAt||Date.now()) - R.t0 - R.paused)/1000; el.textContent = fmtT(s); }
  const cv = $('#rwave');
  if(cv && R.an && !R.pauseAt){
    const g = cv.getContext('2d'), w = cv.width, h = cv.height, d = new Uint8Array(R.an.fftSize); R.an.getByteTimeDomainData(d);
    let peak = 0; for(const v of d) peak = Math.max(peak, Math.abs(v-128)/128);
    R.hist = (R.hist||[]).concat(peak).slice(-64);
    g.clearRect(0,0,w,h); g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--rec').trim()||'#e5484d';
    const bw = w/64; R.hist.forEach((p,i)=>{ const bh = Math.max(4, Math.min(1, p*2.4)*h*0.9); g.beginPath(); g.roundRect?.(i*bw+bw*0.2, (h-bh)/2, bw*0.6, bh, 3); g.fill(); });
  }
  R.raf = requestAnimationFrame(recTick);
}

function meetMap(){
  const m = S.mt.m, r = m.recap||{}, mm = r.mindmap, dur = m.duration||1;
  const secs = (r.sections||[]).map((s,i,a)=>({title:s.title, t:+s.t||0, e: i+1<a.length ? (+a[i+1].t||dur) : dur}));
  const tl = secs.length ? `<div class="sec" style="margin-top:0"><h2>Dòng thời gian</h2><span class="meta">${fmtDur(dur)}</span></div>
    <div class="tline">${secs.map((s,i)=>`<button style="flex:${Math.max(.04,(s.e-s.t)/dur)};--c:${SPK_C[i%SPK_C.length]}" onclick="seek(${s.t})" data-tip="${esc(s.title)} · ${fmtT(s.t)}"><span>${esc(s.title)}</span></button>`).join('')}</div>
    <div class="tlist">${secs.map((s,i)=>`<button onclick="seek(${s.t})"><i style="background:${SPK_C[i%SPK_C.length]}"></i><span class="grow">${esc(s.title)}</span><span class="meta" style="margin:0">${fmtT(s.t)}</span></button>`).join('')}</div>` : '';
  if(!mm || !(mm.children||[]).length) return tl || `<div class="card empty">Chưa có sơ đồ cho cuộc họp này.</div>`;
  // bố cục cây ngang: gốc bên trái, nhánh và ý xếp theo cột
  const COLW = 168, NW = 150, LH = 17, PAD = 10, GAP = 12, nodes = [], links = [];
  const wrap = (s, max=19) => { const w = String(s||'').split(/\s+/), out = []; let cur=''; w.forEach(x=>{ if((cur+' '+x).trim().length>max){ if(cur) out.push(cur); cur=x; } else cur=(cur+' '+x).trim(); }); if(cur) out.push(cur); return out.slice(0,3); };
  let y = 0;
  function place(n, depth){
    const hasT = depth>0 && n.t!==undefined && n.t!==null, lines = wrap(n.label), h = (lines.length + (hasT?1:0))*LH + PAD*2, kids = (n.children||[]).slice(0,8);
    const node = {lines, h, depth, t:n.t, x: depth*COLW};
    if(!kids.length){ node.y = y; y += h + GAP; }
    else { const ch = kids.map(k=>place(k, depth+1)); node.y = (ch[0].y + ch[ch.length-1].y + ch[ch.length-1].h)/2 - h/2; ch.forEach(c=>links.push([node,c])); }
    nodes.push(node); return node;
  }
  place({label: mm.label || m.title, children: mm.children}, 0);
  const W = (Math.max(...nodes.map(n=>n.depth))+1)*COLW, H = y;
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ cuộc họp">
    ${links.map(([a,b])=>{ const x1=a.x+NW, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2, mx=(x1+x2)/2; return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" class="mlink"/>`; }).join('')}
    ${nodes.map(n=>`<g class="mnode d${Math.min(n.depth,2)} ${n.t!==undefined&&n.t!==null?'click':''}" ${n.t!==undefined&&n.t!==null?`onclick="seek(${+n.t})"`:''} transform="translate(${n.x},${n.y})">
      <rect width="${NW}" height="${n.h}" rx="12"/>${n.lines.map((l,i)=>`<text x="12" y="${PAD+LH*(i+1)-4}">${esc(l)}</text>`).join('')}
      ${n.t!==undefined&&n.t!==null&&n.depth?`<text x="12" y="${PAD+LH*(n.lines.length+1)-3}" class="mt">▶ ${fmtT(n.t)}</text>`:''}</g>`).join('')}</svg>`;
  return tl + `<div class="sec"><h2>Sơ đồ ý chính</h2><span class="meta">Chạm vào ý để nghe lại</span></div><div class="mmap">${svg}</div>`;
}

  if(S.mt.seekTo!==undefined && S.mt.seekTo!==null){ const t = S.mt.seekTo; S.mt.seekTo = null; a.addEventListener('loadedmetadata', ()=>{ a.currentTime = t; }, {once:true}); toast('Bấm ▶ để nghe đoạn '+fmtT(t)); }

function meetFollow(t, force){
  const tx = $('#tx'); if(!tx) return;

function contentEnter(){ bindCSwipe(); cPoll(); }
function bindCSwipe(){
  const card = document.querySelector('.ccard:not(.back1):not(.back2)'); if(!card) return;
  let x0=null, dx=0;
  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  card.onpointerdown = e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition='none'; };
  card.onpointermove = e => { if(x0===null) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`; yes.style.opacity = Math.max(0, dx/110); no.style.opacity = Math.max(0, -dx/110); };
  card.onpointerup = card.onpointercancel = () => { if(x0===null) return; x0=null; card.style.transition='transform .25s ease';
    if(Math.abs(dx) > 110) cSwipe(dx>0?1:-1); else { card.style.transform=''; yes.style.opacity=0; no.style.opacity=0; } };
}
function cSwipe(dir, opts){
  const card = document.querySelector('.ccard:not(.back1):not(.back2)'); if(!card) return;
  const id = card.dataset.id;
  haptic(dir>0?'medium':'light');
  card.style.transition='transform .28s ease, opacity .28s'; card.style.transform=`translateX(${dir*480}px) rotate(${dir*18}deg)`; card.style.opacity=0;
  setTimeout(()=> dir>0 ? cApprove(id, opts) : cSkip(id), 220);
}
function cMove(id, status){
  const q = cq(), i = q.new.findIndex(n=>n.id===id); if(i<0) return null;
  const it = q.new.splice(i,1)[0]; q.counts[it.track] = Math.max(0,(q.counts[it.track]||1)-1);
  if(status){ it.status = status; q.working.push(it); }
  return it;
}
async function cSkip(id){
  const it = cMove(id); render();
  try{ await run('noidung','boqua',{iid:id},'',true); }catch(e){ toast(e.message); }
  if(it) toastUndo('Đã bỏ qua', ()=>run('noidung','hoantac',{iid:id},'',true).then(cReload));
}
async function cApprove(id, opts={}){
  const q = cq(); let it = cMove(id, 'queued');
  if(!it){ const w = q.working.find(x=>x.id===id); if(w){ w.status='queued'; w.err=''; } }
  closeSheet(); render();
  try{ const r = await run('noidung','duyet',{id, ...opts},'',true); toast(r.text||'Đã duyệt', 3200); cPoll(true); }
  catch(e){ toast(e.message); cReload(); }
}
function toastUndo(m, fn){
  const t=$('#toast'); t.innerHTML = `${esc(m)} <button class="link" style="color:var(--jade);font-weight:700;margin-left:10px">Hoàn tác</button>`;
  t.style.display='block'; t.querySelector('button').onclick = ()=>{ t.style.display='none'; fn(); };
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 4000);
}
async function cReload(){ try{ S.data.cq = await run('noidung','tongquan',{},'',true); if(S.tab==='content' && !$('#sheet').classList.contains('on')) render(); }catch(e){} }
function cPoll(now){
  clearTimeout(S.cqTimer);
  const pending = () => cq().working.some(w=>w.status==='queued'||w.status==='working');
  if(!pending() && !now) return;
  S.cqTimer = setTimeout(async ()=>{
    const before = new Set(cq().done.map(d=>d.id));
    try{ S.data.cq = await run('noidung','tongquan',{},'',true); }catch(e){ return; }
    const fresh = cq().done.filter(d=>!before.has(d.id));
    if(fresh.length){ notifyH('success'); toast(`Đã tạo xong: ${fresh[0].headline_vi}`, 3500); try{ await refresh(); }catch(e){} return cPoll(); }
    const w = $('#cwork'); if(w && S.tab==='content') w.innerHTML = cWorkHtml();
    if(S.tab==='home' || S.tab==='content') cPoll();
  }, now ? 2500 : 8000);
}

function money(v){ v = Math.round(v||0); const a = Math.abs(v), sg = v<0?'-':''; const t = x => (x.includes('.') ? x.replace(/0+$/,'').replace(/\.$/,'') : x).replace('.',',');
  if(a>=1e9) return sg+t((a/1e9).toFixed(2))+' tỷ'; if(a>=1e6) return sg+t((a/1e6).toFixed(a<1e7?2:1))+' tr'; if(a>=1e3) return sg+t((a/1e3).toFixed(a<1e5?1:0))+'k'; return sg+a+'đ'; }
function tipBind(root){ (root||document).querySelectorAll('.chart').forEach(c=>{ const line = c.querySelector('.tipline'); if(!line) return;
  const show = e => { const t = e.target.closest('[data-tip]'); if(t && c.contains(t)) line.textContent = t.dataset.tip; };
  c.onpointerover = show; c.onclick = show; }); }
function sbar(segs){ const tot = segs.reduce((a,x)=>a+x.v,0) || 1;
  return `<div class="sbar" role="img" aria-label="${esc(segs.map(x=>x.l+' '+x.v).join(', '))}">${segs.filter(x=>x.v>0).map(x=>`<i style="flex:${x.v/tot};background:${x.c}" data-tip="${esc(x.l)}: ${x.v}"></i>`).join('') || '<i style="flex:1;background:var(--fill)"></i>'}</div>
  <div class="legend">${segs.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.l)} <b>${x.v}</b></span>`).join('')}</div>`; }
function vbars(rows, o={}){ // rows: [{l, v, tip, c?}] — cột dọc, đầu bo 4px, khe 2px, nhãn trục thưa
  const W = 320, H = o.h||110, pb = 18, n = rows.length || 1, gap = 2, bw = Math.max(2,(W - gap*(n-1))/n), max = Math.max(...rows.map(r=>r.v), 1);
  const every = Math.ceil(n/ (o.labels||8));
  const bars = rows.map((r,i)=>{ const h = r.v>0 ? Math.max(3, (H-pb-6) * r.v/max) : 0, x = i*(bw+gap), y = H-pb-h, rr = Math.min(4, bw/2);
    const path = h ? `M${x},${H-pb} V${y+rr} Q${x},${y} ${x+rr},${y} H${x+bw-rr} Q${x+bw},${y} ${x+bw},${y+rr} V${H-pb} Z` : '';
    return `<g data-tip="${esc(r.tip||r.l+': '+r.v)}"><rect x="${x}" y="0" width="${bw}" height="${H-pb}" fill="transparent"/>${path?`<path d="${path}" fill="${r.c||o.color||'var(--jade)'}"/>`:''}${i%every===0||i===n-1?`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${esc(r.l)}</text>`:''}</g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${esc(o.aria||'')}"><line class="base" x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}"/>${bars}</svg>`; }
function gbars(rows, keys, o={}){ // nhóm 2 cột / tháng: thu (aqua) và chi (cam)
  const W = 320, H = o.h||130, pb = 18, n = rows.length||1, grpW = W/n, inner = 2, bw = Math.min(22,(grpW-14)/keys.length), max = Math.max(...rows.flatMap(r=>keys.map(k=>r[k.k])),1);
  const g = rows.map((r,i)=>{ const x0 = i*grpW + (grpW - (bw*keys.length + inner*(keys.length-1)))/2;
    return keys.map((k,j)=>{ const v = r[k.k], h = v>0?Math.max(3,(H-pb-6)*v/max):0, x = x0 + j*(bw+inner), y = H-pb-h, rr=Math.min(4,bw/2);
      return h?`<path data-tip="${esc(r.l+' · '+k.l+': '+money(v))}" d="M${x},${H-pb} V${y+rr} Q${x},${y} ${x+rr},${y} H${x+bw-rr} Q${x+bw},${y} ${x+bw},${y+rr} V${H-pb} Z" fill="${k.c}"/>`:''; }).join('') + `<text x="${i*grpW+grpW/2}" y="${H-4}" text-anchor="middle">${esc(r.l)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${esc(o.aria||'')}"><line class="base" x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}"/>${g}</svg>`; }
function hbars(rows, fmtv){ const max = Math.max(...rows.map(r=>Math.max(r.v, r.budget||0)), 1);
  return rows.map(r=>`<div class="hb" data-tip="${esc(r.tip||r.l+': '+(fmtv?fmtv(r.v):r.v))}"><span class="nm">${esc(r.l)}</span><span class="tr"><i class="${r.budget && r.v>r.budget?'over':''}" style="width:${Math.max(r.v?2:0, r.v/max*100)}%"></i>${r.budget?`<u style="left:${r.budget/max*100}%"></u>`:''}</span><span class="v">${fmtv?fmtv(r.v):r.v}</span></div>`).join(''); }
