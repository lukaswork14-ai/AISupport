# Đóng gói app superHuy cho macOS (AppKit + WKWebView), bản universal (Apple Silicon + Intel), ký ad-hoc. Kết quả ghi vào nhánh "mac-app".
name: App macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/mac/**", ".github/workflows/mac-app.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Biên dịch
        run: |
          set -e
          cd desktop/mac
          swiftc -O -target arm64-apple-macos12 -framework Cocoa -framework WebKit main.swift -o sh-arm64
          swiftc -O -target x86_64-apple-macos12 -framework Cocoa -framework WebKit main.swift -o sh-x86
          lipo -create sh-arm64 sh-x86 -output superHuy
      - name: Đóng gói .app + biểu tượng
        run: |
          set -e
          cd desktop/mac
          A=build/superHuy.app; mkdir -p $A/Contents/MacOS $A/Contents/Resources icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon-1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d icon-1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o $A/Contents/Resources/AppIcon.icns
          cp superHuy $A/Contents/MacOS/superHuy && cp Info.plist $A/Contents/Info.plist
          codesign --force --deep --sign - $A
          codesign --verify --verbose $A
          lipo -info $A/Contents/MacOS/superHuy
          cd build && ditto -c -k --keepParent superHuy.app superHuy-mac.zip && ls -la
      - name: Ghi vào nhánh mac-app
        run: |
          cp desktop/mac/build/superHuy-mac.zip /tmp/
          git config user.name "superHuy CI"; git config user.email "ci@superhuy.local"
          git checkout --orphan mac-tmp && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + && cp /tmp/superHuy-mac.zip .
          git add -A && git commit -qm "superHuy macOS $(date -Is)" && git push -qf origin HEAD:mac-app
