# CI/CD superHuy: mỗi lần đẩy lên main -> kiểm tra -> chép code lên VPS -> khởi động lại -> tự quay về bản cũ nếu lỗi.
# Cần secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (tạo bởi deploy/setup_vps.sh). Tuỳ chọn: VPS_PORT.
name: Kiểm tra & triển khai

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Kiểm tra (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Biên dịch toàn bộ mã
        run: python -m compileall -q .
      - name: Import các module chính
        env:
          SUPERHUY_HOME: ${{ runner.temp }}/home
          TELEGRAM_TOKEN: "1:test"
          OWNER_CHAT_ID: "1"
          LLM_API_KEY: test
          OBSIDIAN_VAULT: ${{ runner.temp }}/vault
        run: |
          mkdir -p "$SUPERHUY_HOME"
          python - <<'PY'
          import importlib
          for m in ("config", "hub", "brain", "main", "agents.meeting", "agents.content_hub", "agents.planner",
                    "agents.growth", "agents.fb_reel", "core.qc", "core.vault_sync", "webapp.server"):
              importlib.import_module(m)
          import hub
          from core import registry
          assert len(registry.llm_tools()) > 20, "thiếu công cụ cho trợ lý"
          print("OK:", len(registry.llm_tools()), "công cụ")
          PY
      - name: Kiểm tra JavaScript của Mini App
        run: |
          python - <<'PY'
          import re, pathlib
          s = pathlib.Path("webapp/static/index.html").read_text(encoding="utf-8")
          pathlib.Path("/tmp/app.js").write_text("\n".join(re.findall(r"<script>(.*?)</script>", s, re.S)), encoding="utf-8")
          PY
          node --check /tmp/app.js
      - name: Kiểm tra script triển khai
        run: bash -n deploy/setup_vps.sh && bash -n deploy/release.sh && bash -n deploy/import_data.sh && bash -n deploy/tenant_vps.sh
      - name: Test cách ly khách superYou + chặn lộ khoá
        run: pip install pytest && python -m pytest -q tests

  secrets:
    # Thẻ 13 (họp 17/10/2026): quét khoá bí mật cả khi push thẳng main, không chỉ trên PR. Đỏ = không triển khai.
    name: Quét khoá bí mật (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cài gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Quét các commit vừa đẩy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            ./gitleaks git --no-banner --redact --log-opts="$BEFORE..HEAD" .
          else
            ./gitleaks dir --no-banner --redact .
          fi

  deploy:
    name: Triển khai lên VPS
    needs: [test, secrets]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Kiểm tra cấu hình
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "Chưa có secret VPS_HOST: bỏ qua triển khai."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.skip != '1'
      - name: Khoá SSH
        if: steps.cfg.outputs.skip != '1'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # làm sạch khoá dán từ Windows: bỏ \r, khoảng trắng đầu/cuối dòng; dán mất xuống dòng thì dựng lại
          K=$(printf '%s\n' "$KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          if [ "$(printf '%s\n' "$K" | wc -l)" -le 2 ]; then
            BODY=$(printf '%s' "$K" | sed 's/-----[A-Z ]*-----//g' | tr -d ' \n')
            K=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$(printf '%s' "$BODY" | fold -w 70)")
          fi
          printf '%s\n' "$K" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null || { echo "::error::VPS_SSH_KEY không phải khoá hợp lệ: dán lại TOÀN BỘ khoá riêng (cả dòng BEGIN/END)"; exit 1; }
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Chép code lên VPS
        if: steps.cfg.outputs.skip != '1'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER || 'superhuy' }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete --exclude .git --exclude .github \
            -e "ssh -i ~/.ssh/deploy -p $PORT" ./ "$USER@$HOST:/opt/superhuy/releases/$GITHUB_SHA/"
      - name: Cài đặt, khởi động lại, kiểm tra sức khoẻ
        if: steps.cfg.outputs.skip != '1'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER || 'superhuy' }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" "bash /opt/superhuy/releases/$GITHUB_SHA/deploy/release.sh $GITHUB_SHA"
      - name: Kiểm tra từ Internet
        if: steps.cfg.outputs.skip != '1' && vars.APP_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS -m 10 "${{ vars.APP_URL }}/health" && exit 0; sleep 10; done
          echo "App chưa trả lời qua tên miền (kiểm tra DNS/Caddy)"; exit 1
